<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>行星字体挑选器</title>

<!-- 候选字体走 Google Fonts：联网时才会加载，断网就只有本地那几款 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=EB+Garamond:ital@0;1&family=DM+Serif+Display:ital@0;1&family=Italiana&family=Bodoni+Moda:ital@0;1&family=Marcellus&family=Playfair+Display:ital,wght@0,600;1,600&family=Inter:wght@400;600&family=Manrope:wght@400;600&family=Space+Grotesk:wght@400;600&family=Outfit:wght@400;600&family=Sora:wght@400;600&family=Parisienne&family=Sacramento&family=Dancing+Script&family=Caveat&family=Petit+Formal+Script&family=Italianno&family=DM+Mono:wght@400;500&family=IBM+Plex+Mono:wght@400;500&family=Space+Mono&family=Roboto+Mono:wght@400;500&display=swap" rel="stylesheet">

<style>
  /* ── App 里已经带的那几款（本地文件，不用联网）── */
  @font-face{font-family:"LXGW WenKai";src:url("fonts/lxgw_wenkai.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"Cinzel Decorative";src:url("fonts/cinzel_decorative.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"Great Vibes";src:url("fonts/great_vibes.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"JetBrains Mono";src:url("fonts/jetbrains_mono.ttf") format("truetype");font-display:swap}
  @font-face{font-family:"Cormorant";src:url("fonts/cormorant-400i.woff2") format("woff2");font-style:italic;font-display:swap}
  @font-face{font-family:"Playfair";src:url("fonts/playfair-600i.woff2") format("woff2");font-style:italic;font-weight:600;font-display:swap}
  @font-face{font-family:"Tangerine";src:url("fonts/tangerine-400.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"ZCOOL XiaoWei Sub";src:url("fonts/zcool-sub.woff2") format("woff2");font-display:swap}
  @font-face{font-family:"Ma Shan Zheng Sub";src:url("fonts/mashan-sub.woff2") format("woff2");font-display:swap}

  :root{--ink:#2B2F36;--dim:#7A8290;--line:#E3E6EB;--accent:#5C7089;--paper:#F4F5F7}
  *{box-sizing:border-box}
  body{margin:0;background:var(--paper);color:var(--ink);
       font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;padding:22px 18px 60px}
  h1{font-size:20px;margin:0 0 4px}
  .sub{color:var(--dim);font-size:12.5px;line-height:1.7;margin-bottom:16px}
  .bar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 22px}
  .bar button{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;
              padding:6px 14px;font-size:12.5px;cursor:pointer}
  .bar button.on{background:var(--accent);border-color:var(--accent);color:#fff}
  .card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px 18px;margin-bottom:14px}
  .head{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:10px}
  .no{font-size:12px;color:#fff;background:var(--accent);border-radius:6px;padding:2px 7px;letter-spacing:.5px}
  .name{font-size:14px;font-weight:600}
  .tag{font-size:11px;color:var(--dim);border:1px solid var(--line);border-radius:999px;padding:1.5px 9px}
  .tag.have{color:#3E7A57;border-color:#BFE0CC;background:#EFF8F2}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:baseline}
  .big{font-size:34px;line-height:1.35}
  .mid{font-size:20px;line-height:1.4}
  .num{font-size:26px;letter-spacing:.5px;font-variant-numeric:tabular-nums}
  .num2{font-size:13px;color:var(--dim)}
  .lab{font-size:11px;color:var(--dim);margin:8px 0 2px;letter-spacing:.4px}
  .ghost{color:#B7BCC4}
  hr{border:0;border-top:1px dashed var(--line);margin:12px 0}
  .hint{font-size:12px;color:var(--dim);line-height:1.8;background:#fff;border:1px dashed var(--line);
        border-radius:14px;padding:12px 14px;margin-bottom:18px}
  .glyph{font-size:22px;line-height:1.9;word-break:break-all}
  code{background:#EEF0F3;border-radius:5px;padding:1px 5px;font-size:12px}
  .hide{display:none}
</style>
</head>
<body>

<h1>行星字体挑选器</h1>
<div class="sub">
  照着看、点着筛。左边编号（F1、F2…）就是回答时用的名字，比如「F3 用大标题、F9 用数字」。<br>
  绿标签=App 里已经带了（不用联网）；灰标签=候选，要联网才看得到、选中我就下载嵌进包里。
</div>

<div class="hint">
  <b>怎么用</b>：每个卡里从上到下是「中文样张 / 英文样张 / 数字样张」。<br>
  · 中文换字体要整份嵌进 APK（一款 3～10MB，装的人会变大，所以中文最多挑 1～2 款）；<br>
  · 英文/数字字体通常只有几十到几百 KB，可以多挑几款，分别给大标题、小标题、数字用；<br>
  · 设置页现在那些花字（𝒮𝓉𝒶𝓉𝓊𝓈 这种）是**特殊字符**不是字体，最后那一栏单独列给你挑。
</div>

<div class="bar" id="bar">
  <button data-k="all" class="on">全部</button>
  <button data-k="cn">中文</button>
  <button data-k="en">英文（标题/花体）</button>
  <button data-k="num">数字 / 等宽</button>
  <button data-k="glyph">花字字符</button>
</div>

<div id="list"></div>

<script>
const F = [
  // ── 中文 ──
  {id:"F1", cat:"cn", name:"霞鹜文楷 LXGW WenKai", tag:"已在 App", have:true, stack:'"LXGW WenKai"', note:"楷体，正文就有味道；现在设置页/聊天没在用，只在包里"},
  {id:"F2", cat:"cn", name:"站酷小薇（只有「记忆是自我方向」这几个字）", tag:"已在 App · 子集", have:true, stack:'"ZCOOL XiaoWei Sub"', note:"记忆星河标题用的那个子集，字不够多的句子会掉回系统字体"},
  {id:"F3", cat:"cn", name:"马善政毛笔（子集）", tag:"已在 App · 子集", have:true, stack:'"Ma Shan Zheng Sub"', note:"星河里那一小撮字，同样只有子集"},
  {id:"F4", cat:"cn", name:"系统默认（苹方 / 微软雅黑）", tag:"零成本", have:true, stack:'-apple-system,"PingFang SC","Microsoft YaHei",sans-serif', note:"不占包体，最稳。中文要是拿不定主意，就留它"},
  {id:"F5", cat:"cn", name:"思源宋体 / 思源黑体（候选）", tag:"要下载·3～10MB", have:false, stack:'"Source Han Serif","Songti SC",serif', note:"衬线宋体做大标题挺有味道；黑体适合正文。要嵌进包才能保证一致"},
  {id:"F6", cat:"cn", name:"得意黑 Smiley Sans（候选）", tag:"要下载·2MB", have:false, stack:'"Smiley Sans","PingFang SC",sans-serif', note:"中英混排很潮的斜黑体，标题感强；正文不适合"},

  // ── 英文 / 花体 ──
  {id:"F7", cat:"en", name:"Cinzel Decorative", tag:"已在 App", have:true, stack:'"Cinzel Decorative",serif', note:"罗马风装饰大写，适合 𝒮ℯ𝓉𝓉𝒾𝓃ℊ 这种「标题」气质"},
  {id:"F8", cat:"en", name:"Great Vibes", tag:"已在 App", have:true, stack:'"Great Vibes",cursive', note:"手写花体，长句好看；小字号会糊"},
  {id:"F9", cat:"en", name:"Tangerine", tag:"已在 App", have:true, stack:'"Tangerine",cursive', note:"极细花体，星河标题用过（Finding oneself 那个）"},
  {id:"F10", cat:"en", name:"Cormorant（斜体）", tag:"已在 App", have:true, stack:'"Cormorant",serif', note:"衬线意体，安静、适合小标题"},
  {id:"F11", cat:"en", name:"Playfair Display（粗斜）", tag:"已在 App", have:true, stack:'"Playfair",serif', note:"衬线里比较有存在感的，适合分栏标题"},
  {id:"F12", cat:"en", name:"Italiana（候选）", tag:"需联网", have:false, stack:'"Italiana",serif', note:"超细高对比大写，做「标题花字」很干净"},
  {id:"F13", cat:"en", name:"Bodoni Moda（候选）", tag:"需联网", have:false, stack:'"Bodoni Moda",serif', note:"时装杂志那味；数字也好看"},
  {id:"F14", cat:"en", name:"DM Serif Display（候选）", tag:"需联网", have:false, stack:'"DM Serif Display",serif', note:"厚衬线，标题稳"},
  {id:"F15", cat:"en", name:"Marcellus（候选）", tag:"需联网", have:false, stack:'"Marcellus",serif', note:"小大写罗马体，可做「小节标题」"},
  {id:"F16", cat:"en", name:"EB Garamond（候选）", tag:"需联网", have:false, stack:'"EB Garamond",serif', note:"老书味正文"},
  {id:"F17", cat:"en", name:"Parisienne / Sacramento / Italianno（候选花体）", tag:"需联网", have:false, stack:'"Parisienne",cursive', note:"另外三种手写体，比 Great Vibes 细/稳一点"},
  {id:"F18", cat:"en", name:"Space Grotesk / Sora / Outfit / Manrope / Inter（候选无衬线）", tag:"需联网", have:false, stack:'"Space Grotesk",sans-serif', note:"现代无衬线，做小标题/按钮字都行"},

  // ── 数字 / 等宽 ──
  {id:"F19", cat:"num", name:"JetBrains Mono", tag:"已在 App", have:true, stack:'"JetBrains Mono",monospace', note:"等宽，数字对齐稳；状态面板那种数值首选"},
  {id:"F20", cat:"num", name:"DM Mono（候选）", tag:"需联网", have:false, stack:'"DM Mono",monospace', note:"比 JetBrains 细一点、秀气"},
  {id:"F21", cat:"num", name:"IBM Plex Mono（候选）", tag:"需联网", have:false, stack:'"IBM Plex Mono",monospace', note:"IBM 那套，数字有味道"},
  {id:"F22", cat:"num", name:"Space Mono / Roboto Mono（候选）", tag:"需联网", have:false, stack:'"Space Mono",monospace', note:"Space Mono 复古、Roboto Mono 中性"},
  {id:"F23", cat:"num", name:"Sora / Inter 的表格数字（候选）", tag:"需联网", have:false, stack:'"Sora",sans-serif', note:"不做等宽、只用 tabular figures 的路线，跟正文更统一"},
];

const GLYPH = [
  {t:"花体 Script（设置页标题现在用的这种）", g:"𝒜ℬ𝒞𝒟ℰℱ𝒢ℋℐ𝒥𝒦ℒℳ𝒩𝒪𝒫𝒬ℛ𝒮𝒯𝒰𝒱𝒲𝒳𝒴𝒵 / 𝒶𝒷𝒸𝒹ℯ𝒻ℊ𝒽𝒾𝒿𝓀𝓁𝓂𝓃ℴ𝓅𝓆𝓇𝓈𝓉𝓊𝓋𝓌𝓍𝓎𝓏"},
  {t:"粗花体 Bold Script", g:"𝓐𝓑𝓒𝓓𝓔𝓕𝓖𝓗𝓘𝓙𝓚𝓛𝓜𝓝𝓞𝓟𝓠𝓡𝓢𝓣𝓤𝓥𝓦𝓧𝓨𝓩 / 𝓪𝓫𝓬𝓭𝓮𝓯𝓰𝓱𝓲𝓳𝓴𝓵𝓶𝓷𝓸𝓹𝓺𝓻𝓼𝓽𝓾𝓿𝔀𝔁𝔂𝔃"},
  {t:"哥特体 Fraktur", g:"𝔄𝔅ℭ𝔇𝔈𝔉𝔊ℌℑ𝔍𝔎𝔏𝔐𝔑𝔒𝔓𝔔ℜ𝔖𝔗𝔘𝔙𝔚𝔛𝔜ℨ / 𝔞𝔟𝔠𝔡𝔢𝔣𝔤𝔥𝔦𝔧𝔨𝔩𝔪𝔫𝔬𝔭𝔮𝔯𝔰𝔱𝔲𝔳𝔴𝔵𝔶𝔷"},
  {t:"双线体 Double-struck", g:"𝔸𝔹ℂ𝔻𝔼𝔽𝔾ℍ𝕀𝕁𝕂𝕃𝕄ℕ𝕆ℙℚℝ𝕊𝕋𝕌𝕍𝕎𝕏𝕐ℤ / 𝟘𝟙𝟚𝟛𝟜𝟝𝟞𝟟𝟠𝟡"},
  {t:"等宽体 Monospace（数字很整）", g:"𝙰𝙱𝙲𝙳𝙴𝙵𝙶𝙷𝙸𝙹𝙺𝙻𝙼𝙽𝙾𝙿𝚀𝚁𝚂𝚃𝚄𝚅𝚆𝚇𝚈𝚉 / 𝟶𝟷𝟸𝟹𝟺𝟻𝟼𝟽𝟾𝟿"},
  {t:"无衬线粗斜 Sans-bold-italic", g:"𝘼𝘽𝘾𝘿𝙀𝙁𝙂𝙃𝙄𝙅𝙆𝙇𝙈𝙉𝙊𝙋𝙌𝙍𝙎𝙏𝙐𝙑𝙒𝙓𝙔𝙕 / 𝙖𝙗𝙘𝙙𝙚𝙛𝙜𝙝𝙞𝙟𝙠𝙡𝙢𝙣𝙤𝙥𝙦𝙧𝙨𝙩𝙪𝙫𝙬𝙭𝙮𝙯"},
  {t:"小大写 Small caps", g:"ᴀʙᴄᴅᴇꜰɢʜɪᴊᴋʟᴍɴᴏᴘQʀꜱᴛᴜᴠᴡxʏᴢ"},
  {t:"圈 / 括号数字（做「·」这类小标记很顺手）", g:"①②③④⑤ / ⑴⑵⑶ / ⓵⓶⓷ / ⅰ ⅱ ⅲ / ❶❷❸"},
];

const list = document.getElementById("list");
function render(cat){
  list.innerHTML = "";
  F.filter(f => cat === "all" || f.cat === cat).forEach(f => {
    const el = document.createElement("div");
    el.className = "card";
    el.innerHTML = `
      <div class="head">
        <span class="no">${f.id}</span>
        <span class="name">${f.name}</span>
        <span class="tag ${f.have ? 'have' : ''}">${f.tag}</span>
      </div>
      <div class="lab">中文</div>
      <div class="big" style="font-family:${f.stack}">记忆星河 · 我的身体 · 谁在接消息</div>
      <div class="lab">英文</div>
      <div class="mid" style="font-family:${f.stack}">Setting the galaxy, Dawn · Finding oneself</div>
      <div class="lab">数字</div>
      <div class="row">
        <div class="num" style="font-family:${f.stack}">2026 / 99.9% / 500,000</div>
        <div class="num2" style="font-family:${f.stack}">1111111111<br>8888888888</div>
      </div>
      <hr>
      <div class="num2">${f.note}</div>`;
    list.appendChild(el);
  });
  if (cat === "all" || cat === "glyph") {
    const wrap = document.createElement("div");
    wrap.innerHTML = `<div class="card">
      <div class="head"><span class="no">字</span><span class="name">花字字符（不是字体，是特殊字符）</span>
      <span class="tag">挑一种当「花字」用</span></div>
      ${GLYPH.map(x => `<div class="lab">${x.t}</div><div class="glyph">${x.g}</div>`).join("")}
      <hr><div class="num2">告诉我要哪一行，我就把设置页那些标题、按钮字统一换成它。</div></div>`;
    list.appendChild(wrap);
  }
}
document.getElementById("bar").addEventListener("click", e => {
  const b = e.target.closest("button"); if (!b) return;
  [...document.querySelectorAll("#bar button")].forEach(x => x.classList.remove("on"));
  b.classList.add("on");
  render(b.dataset.k);
});
render("all");
</script>
</body>
</html>
